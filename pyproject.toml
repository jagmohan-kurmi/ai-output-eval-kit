[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-output-eval-kit"
version = "0.1.0"
description = "Offline JSONL evaluation for generated outputs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
ai-output-eval-kit = "ai_output_eval_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
